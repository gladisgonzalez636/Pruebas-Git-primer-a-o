<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario-pagina-web.css">
    <title>Document</title>
</head>

<body>
    <div class="titulo1">
        <h1>Ejemplo de Página Web</h1>
    </div>
    <main>
        <section class="formulario">
            <form>
                <h4>formulario</h4>
                <input type="text" placeholder="nombre" id="nombre" name="nombre" required>
                <input type="email" placeholder="Correo electrónico" id="email" name="email" required>
                <select type="radio" id="radio" name="radio">
                    <option value="radio">Selecciona el País</option>
                    <option value="radio">Argentina</option>
                    <option value="radio">Nicaragua</option>
                    <option value="radio">Honduras</option>
                    <option value="radio">Guatemala</option>
                    <option value="radio">Panamá</option>
                </select>
                <button type="submit" class="boton1" id="submit" name="submit">enviar</button>
                <ul class="Ul">
                    <h3 class="titulo3">Lista de tareas</h3>
                    <li>Aprender HTML</li>
                    <li>Practicar CSS</li>
                    <li>Estudiar Python</li>
                </ul>
            </form>

            <section class="tab">
                <table>
                    <caption>Listas de Productos</caption>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>País</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Ana</td>
                            <td>España</td>

                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Luis</td>
                            <td>México</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>María</td>
                            <td>Argentina</td>
                        </tr>
                    </tbody>
                </table>
                <p class="tuplas">Tuplas y Matrices (py)</p>
            </section>
        </section>
        <button type="submit" class="boton2" id="submit" name="submit">Soy fijo</button>
    </main>
</body>
</html>
