<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario-diseño.css">
    <title>Document</title>
</head>
<body>
    <div class="caja">
        <div class="contenedor">
            <div class="contenido">
                <h1>Meu Consultórico</h1>
            </div>
            <div class="cont1">
                <h2>Bem-Vindo,<br>Seu consultórico<br> está a apenas<br> un clique!</h2>
            </div>
            <div class="cont2">
                <p>informe seus dados ao lado<br>e desfrute da melhor ferramenta<br>de gerenciamento de consultóricos</p>
            </div>       
        </div>
        <form>
            <h3 class="titulo5">Cadastro</h3>
            <div class="tem">
                <p>Já tem uma conta? </p>
                <button class="boton">Entre aqui</button> 
            </div>
            <h4>Dados Pessoais</h4>
            <div class="tabla">
                <div class="tabla1">
                    <div class="informacion">
                        <label form="nombre"> Nome </label><br>
                        <input type="text" placeholder="Informe seu nome completo" id="nombre" name="nombre" required> 
                    </div>
                    <div class="informacion">
                        <label form="nombre"> CPF </label><br>
                        <input type="text" placeholder="Informe os números do seu CPF" id="nombre" name="nombre" required>
                    </div>
                </div>

                <div class="tabla1">
                    <div class="informacion">
                        <label form="email">E-mail</label><br>
                        <input type="email" placeholder="Informe o seu e-mail" id="email" name="email" required>
                    </div>

                    <div class="informacion">
                        <label form="email">Senha</label><br>
                        <input type="email" placeholder="contraseña" id="email" name="email" required>
                    </div>
                </div>
            </div>
            <h4>Dados Profissionais</h4>

            <div class="tabla">
                <div class="tabla1">
                    <div class="informacion">
                        <label form="nombre"> Sigla do Conselho </label><br>
                        <input type="text" placeholder="Seleccione ou digite a sigla" id="nombre" name="nombre" required>
                    </div>
                
                    <div class="informacion">
                        <label form="nombre">UF</label><br>
                        <input type="text" placeholder="Seleccione ou digite o estado" >
                    </div>
                </div>

                <div class="tabla1">
                    <div class="informacion">
                        <label form="nombre"> Número do Conselho </label><br>
                        <input type="text" placeholder="Informe o seu número do conselho" id="nombre" name="nombre" required>
                    </div>

                    <div class="informacion">
                        <label   label form="nombre">Especialidade</label><br>
                        <input type="text" placeholder="informe a sua especialidade" id="nombre" name="nombre" required>
                    </div>
                </div>
            </div><br><br>
            <div class="boton5">
                <button class="cad">Cadastrar</button> 
            </div>
        </form>
    </div>
</body>
</html>
